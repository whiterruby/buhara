<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>BUHARA</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<meta name="theme-color" content="#0b141a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="BUHARA"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<!-- GİRİŞ -->
<section id="view-login" class="login-wrap">
  <div class="login-card">
    <div class="avatar big">B</div>
    <h1>BUHARA</h1>
    <input id="email" placeholder="e-posta" autocomplete="username" inputmode="email"/>
    <input id="pass" type="password" placeholder="şifre" autocomplete="current-password"/>
    <input id="room" type="password" placeholder="oda şifresi (ilk girişte bir kez)" autocomplete="off"/>
    <button id="loginBtn">Giriş yap</button>
    <div id="loginErr"></div>
  </div>
</section>

<!-- SOHBET -->
<section id="view-chat" class="hidden chat-wrap">
  <header class="topbar">
    <div class="avatar">B</div>
    <div class="tt"><h2>BUHARA</h2><span id="statusText">bağlanıyor…</span></div>
    <span class="dot" id="statusDot"></span>
    <button id="logoutBtn" title="Çıkış">⎋</button>
  </header>

  <div id="log"></div>

  <footer class="dock">
    <div class="attach hidden" id="attachSheet">
      <button id="optPhoto">🖼️<span>Resim</span></button>
      <button id="optVideo">🎬<span>Video</span></button>
      <button id="optLocation">📍<span>Konum</span></button>
      <button id="optGif">✨<span>GIF</span></button>
    </div>
    <div class="row">
      <button id="attachBtn" aria-label="Ekle">＋</button>
      <input id="msg" placeholder="Mesaj" autocomplete="off"/>
      <button id="send" aria-label="Gönder">➤</button>
    </div>
    <input type="file" id="img" accept="image/*" class="hidden"/>
    <input type="file" id="video" accept="video/*" class="hidden"/>
    <input type="file" id="gifFile" accept="image/gif" class="hidden"/>
  </footer>
</section>

<script type="module" src="chat.js"></script>
<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
</script>
</body>
</html>
